blueprint:
  name: Medication Reminder - notification actions (mark given / skip / snooze)
  description: >
    Handles the "Mark given", "Skip today", and "Remind me later" buttons on the
    reminder and missed-dose notifications (marks the dose given, skips it for the
    day, or snoozes its reminder), and clears those notifications whenever a dose
    is marked given, skipped, or snoozed by any means: a button, the dashboard, an
    NFC tag, or the mark_given / skip_today / snooze service. Import this alongside
    the dose-reminders blueprint.
  domain: automation
  author: magikh0e
  source_url: https://github.com/magikh0e/ha-medication-reminder/blob/main/blueprints/automation/medication_reminder/mark_given.yaml
  input:
    fallback_notify:
      name: Fallback notify target
      description: >
        Notify service used to clear notifications when a dose has no per-patient
        target set, without the "notify." prefix.
      default: caretakers
      selector:
        text:
    snooze_minutes:
      name: Snooze delay (minutes)
      description: >
        How long "Remind me later" defers a dose's reminder before it comes back.
      default: 30
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: box

trigger:
  # The notification's "Mark given" / "Remind me later" / "Skip today" buttons.
  - platform: event
    event_type: mobile_app_notification_action
    id: notif
  # Any other way a dose is marked given (dashboard, NFC tag, mark_given
  # service, another device) fires this event, so the notification clears too.
  - platform: event
    event_type: medication_reminder_dose_given
    id: given
  # Likewise for a dose skipped for the day by any means (service, dashboard).
  - platform: event
    event_type: medication_reminder_dose_skipped
    id: skipped
  # And for a dose snoozed by any means, so the current reminder clears.
  - platform: event
    event_type: medication_reminder_dose_snoozed
    id: snoozed
condition:
  - >-
    {{ trigger.id in ['given', 'skipped', 'snoozed']
       or (trigger.event.data.action is defined
           and (trigger.event.data.action.startswith('MED_GIVEN_')
                or trigger.event.data.action.startswith('MED_SKIP_')
                or trigger.event.data.action.startswith('MED_SNOOZE_'))) }}
variables:
  default_notify: !input fallback_notify
  snooze_minutes: !input snooze_minutes
  oid: >-
    {{ trigger.event.data.entity_id.split('.')[1]
         if trigger.id in ['given', 'skipped', 'snoozed']
       else trigger.event.data.action
            | replace('MED_GIVEN_', '') | replace('MED_SKIP_', '') | replace('MED_SNOOZE_', '') }}
  ent: "switch.{{ oid }}"
  notify_service: "{{ state_attr(ent, 'notify_service') or default_notify }}"
  # The grouped-reminder tag for this dose's (patient, time) slot, so a grouped
  # notification clears too when one of its doses is handled.
  gtag: >-
    {{ ('med_grp_' ~ (state_attr(ent, 'patient') or '') ~ '_' ~ (state_attr(ent, 'dose_time') or '')) | replace(' ', '_') | replace(':', '') }}
  is_give_button: >-
    {{ trigger.id == 'notif' and trigger.event.data.action is defined
       and trigger.event.data.action.startswith('MED_GIVEN_') }}
  is_skip_button: >-
    {{ trigger.id == 'notif' and trigger.event.data.action is defined
       and trigger.event.data.action.startswith('MED_SKIP_') }}
  is_snooze_button: >-
    {{ trigger.id == 'notif' and trigger.event.data.action is defined
       and trigger.event.data.action.startswith('MED_SNOOZE_') }}
action:
  # A button press performs the action; the event paths are already a consequence
  # of the switch changing, so they only clear the notifications.
  - if: "{{ is_give_button }}"
    then:
      - action: switch.turn_on
        target:
          entity_id: "{{ ent }}"
  - if: "{{ is_skip_button }}"
    then:
      - action: medication_reminder.skip_today
        target:
          entity_id: "{{ ent }}"
  - if: "{{ is_snooze_button }}"
    then:
      - action: medication_reminder.snooze
        target:
          entity_id: "{{ ent }}"
        data:
          minutes: "{{ snooze_minutes | int(30) }}"
  - action: "notify.{{ notify_service }}"
    data:
      message: "clear_notification"
      data:
        tag: "med_{{ oid }}"
  - action: "notify.{{ notify_service }}"
    data:
      message: "clear_notification"
      data:
        tag: "med_missed_{{ oid }}"
  # Clear the grouped reminder for this dose's slot too (a no-op if there is none).
  - action: "notify.{{ notify_service }}"
    data:
      message: "clear_notification"
      data:
        tag: "{{ gtag }}"
mode: parallel
