blueprint:
  name: Medication Reminder - mark given or skip from notification
  description: >
    Handles the "Mark given" and "Skip today" buttons on the reminder and
    missed-dose notifications (marks the dose given, or skips it for the day),
    and clears those notifications whenever a dose is marked given or skipped by
    any means: a button, the dashboard, an NFC tag, or the mark_given /
    skip_today service. Import this alongside the dose-reminders blueprint.
  domain: automation
  author: magikh0e
  source_url: https://github.com/magikh0e/ha-medication-reminder/blob/main/blueprints/automation/medication_reminder/mark_given.yaml
  input:
    fallback_notify:
      name: Fallback notify target
      description: >
        Notify service used to clear notifications when a dose has no per-patient
        target set, without the "notify." prefix.
      default: caretakers
      selector:
        text:

trigger:
  # The notification's "Mark given" / "Skip today" buttons.
  - platform: event
    event_type: mobile_app_notification_action
    id: notif
  # Any other way a dose is marked given (dashboard, NFC tag, mark_given
  # service, another device) fires this event, so the notification clears too.
  - platform: event
    event_type: medication_reminder_dose_given
    id: given
  # Likewise for a dose skipped for the day by any means (service, dashboard).
  - platform: event
    event_type: medication_reminder_dose_skipped
    id: skipped
condition:
  - >-
    {{ trigger.id in ['given', 'skipped']
       or (trigger.event.data.action is defined
           and (trigger.event.data.action.startswith('MED_GIVEN_')
                or trigger.event.data.action.startswith('MED_SKIP_'))) }}
variables:
  default_notify: !input fallback_notify
  oid: >-
    {{ trigger.event.data.entity_id.split('.')[1]
         if trigger.id in ['given', 'skipped']
       else trigger.event.data.action | replace('MED_GIVEN_', '') | replace('MED_SKIP_', '') }}
  ent: "switch.{{ oid }}"
  notify_service: "{{ state_attr(ent, 'notify_service') or default_notify }}"
  is_give_button: >-
    {{ trigger.id == 'notif' and trigger.event.data.action is defined
       and trigger.event.data.action.startswith('MED_GIVEN_') }}
  is_skip_button: >-
    {{ trigger.id == 'notif' and trigger.event.data.action is defined
       and trigger.event.data.action.startswith('MED_SKIP_') }}
action:
  # A button press performs the action; the event paths are already a consequence
  # of the switch changing, so they only clear the notifications.
  - if: "{{ is_give_button }}"
    then:
      - action: switch.turn_on
        target:
          entity_id: "{{ ent }}"
  - if: "{{ is_skip_button }}"
    then:
      - action: medication_reminder.skip_today
        target:
          entity_id: "{{ ent }}"
  - action: "notify.{{ notify_service }}"
    data:
      message: "clear_notification"
      data:
        tag: "med_{{ oid }}"
  - action: "notify.{{ notify_service }}"
    data:
      message: "clear_notification"
      data:
        tag: "med_missed_{{ oid }}"
mode: parallel
