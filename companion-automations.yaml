# Companion automations for the Medication Reminder integration.
#
# The integration creates a switch per dose (on = given today), handles the
# daily reset, and stores each patient's settings (notify target, nag window,
# nag interval, scheduled days). These automations do the reminders, nagging,
# and missed-dose escalation by reading EVERY dose switch's attributes. Add a
# patient or dose in the UI, or change a patient's settings, and these pick it
# up automatically; no edits needed here.
#
# Cadence: reminders fire on a 5-minute tick (prompt first ping), re-nag every
# patient's `nag_interval` minutes, and escalate once at the window-end
# (`nag_minutes`). A dose is only acted on if today is one of its scheduled
# `days`. Each patient's reminders go to the notify target chosen in the UI.

- id: med_reminder
  alias: "Medication - Reminders & missed-dose escalation"
  trigger:
    - platform: time_pattern
      minutes: "/5"
  variables:
    default_notify: caretakers
    # Flip to true to make the missed-dose alert override Silent / Do Not Disturb
    # (iPhone needs Critical Alerts allowed for the HA app; Android uses a
    # high-importance channel).
    critical_missed: false
    # Set to a Lovelace path (e.g. /lovelace-meds/0) to open that dashboard when
    # the notification body is tapped. Leave "" to open the app default.
    dashboard_path: ""
    # When several doses are due for the same patient at the same time, send one
    # combined reminder (tap to open the dashboard) instead of one per dose. Set
    # to false for one notification per dose with its action buttons.
    group_reminders: true
    nav: >-
      {{ {"clickAction": dashboard_path, "url": dashboard_path} if dashboard_path else {} }}
    today: "{{ ['mon','tue','wed','thu','fri','sat','sun'][now().weekday()] }}"
    week: "{{ ['mon','tue','wed','thu','fri','sat','sun'] }}"
  action:
    - repeat:
        for_each: >
          {{ states.switch
             | selectattr('attributes.medications', 'defined')
             | map(attribute='entity_id') | list }}
        sequence:
          - variables:
              ent: "{{ repeat.item }}"
              oid: "{{ ent.split('.')[1] }}"
              given: "{{ is_state(ent, 'on') }}"
              skipped: "{{ state_attr(ent, 'skipped_today') | default(false, true) }}"
              handled: "{{ given or skipped }}"
              dtime: "{{ state_attr(ent, 'dose_time') }}"
              patient: "{{ state_attr(ent, 'patient') }}"
              meds: "{{ state_attr(ent, 'medications') }}"
              days: "{{ state_attr(ent, 'days') or ['mon','tue','wed','thu','fri','sat','sun'] }}"
              scheduled: "{{ (today in days) if state_attr(ent, 'scheduled_today') is none else state_attr(ent, 'scheduled_today') }}"
              notify_service: "{{ state_attr(ent, 'notify_service') or default_notify }}"
              nag_minutes: "{{ state_attr(ent, 'nag_minutes') | int(45) }}"
              nag_interval: "{{ state_attr(ent, 'nag_interval') | int(15) }}"
              snooze_until: "{{ state_attr(ent, 'snooze_until') }}"
              # A snooze ("remind me later") pushes the whole nag/missed window
              # out: time the dose from the later of its time and the snooze.
              ref_ts: "{{ [as_timestamp(today_at(dtime)), (as_timestamp(snooze_until) if snooze_until else 0)] | max }}"
              mins_since: "{{ (as_timestamp(now()) - ref_ts) / 60 }}"
              clock: "{{ (as_timestamp(today_at(dtime)) | timestamp_custom('%H:%M')) if state_attr(ent, 'time_format') == '24h' else (as_timestamp(today_at(dtime)) | timestamp_custom('%I:%M %p')).lstrip('0') }}"
              reminder_due: "{{ scheduled and not handled and mins_since >= 0 and mins_since < nag_minutes and (mins_since % nag_interval) < 5 }}"
              missed_due: "{{ scheduled and not handled and mins_since >= nag_minutes and mins_since < nag_minutes + 5 }}"
              # Oids of doses in the same (patient, time) slot reminder-due now,
              # each judged by its own state and snooze. Derived live (no
              # serialized data), so any med/patient name is safe.
              slot_reminder: >
                {% set ns = namespace(l=[]) %}
                {% for t in states.switch if t.attributes.medications is defined
                     and t.attributes.patient == patient
                     and t.attributes.dose_time == dtime %}
                {% set ta = t.attributes %}
                {% set th = (t.state == 'on') or (ta.skipped_today | default(false, true)) %}
                {% set tsch = (today in (ta.days or week)) if ta.scheduled_today is none else ta.scheduled_today %}
                {% set tsu = ta.snooze_until %}
                {% set tref = [as_timestamp(today_at(dtime)), (as_timestamp(tsu) if tsu else 0)] | max %}
                {% set tmins = (as_timestamp(now()) - tref) / 60 %}
                {% set tnagm = ta.nag_minutes | int(45) %}
                {% set tnagi = ta.nag_interval | int(15) %}
                {% if tsch and not th and tmins >= 0 and tmins < tnagm and (tmins % tnagi) < 5 %}
                {% set ns.l = ns.l + [t.entity_id.split('.')[1]] %}
                {% endif %}
                {% endfor %}
                {{ ns.l | sort }}
              group_n: "{{ slot_reminder | length }}"
              is_rep: "{{ slot_reminder and oid == slot_reminder[0] }}"
              slot_meds: "{{ slot_reminder | map('regex_replace', '^', 'switch.') | map('state_attr', 'medications') | list | join('; ') }}"
              gtag: "{{ ('med_grp_' ~ patient ~ '_' ~ dtime) | replace(' ', '_') | replace(':', '') }}"
          - choose:
              # Reminder, per-dose: every due dose when grouping is off, or the
              # only dose due in its slot. Classic behaviour, with action buttons.
              - conditions:
                  - "{{ reminder_due and (not group_reminders or group_n <= 1) }}"
                sequence:
                  - action: "notify.{{ notify_service }}"
                    data:
                      title: "💊 {{ patient }} ({{ clock }})"
                      message: "Give {{ patient }}'s medication: {{ meds }}. Has it been given?"
                      data: >-
                        {{ {"tag": "med_" ~ oid,
                            "actions": [{"action": "MED_GIVEN_" ~ oid, "title": "✅ Mark given"},
                                        {"action": "MED_SNOOZE_" ~ oid, "title": "⏰ Remind me later"},
                                        {"action": "MED_SKIP_" ~ oid, "title": "⏭️ Skip today"}]}
                           | combine(nav) }}
              # Reminder, grouped: several doses due in the slot. One message from
              # the slot's first dose; tap it to open the dashboard and act there.
              - conditions:
                  - "{{ reminder_due and group_reminders and group_n > 1 and is_rep }}"
                sequence:
                  - action: "notify.{{ notify_service }}"
                    data:
                      title: "💊 {{ patient }} ({{ clock }})"
                      message: "{{ group_n }} doses due: {{ slot_meds }}. Open the dashboard to handle them."
                      data: "{{ {'tag': gtag} | combine(nav) }}"
              # Missed: scheduled today, past the window-end, fires once (per-dose)
              - conditions:
                  - "{{ missed_due }}"
                sequence:
                  # Critical (override Silent/DND) or normal time-sensitive, per
                  # critical_missed. One payload: iPhones read
                  # interruption-level/sound, Android reads channel/importance.
                  - variables:
                      missed_data: >-
                        {{ ({"tag": "med_missed_" ~ oid, "priority": "high", "ttl": 0,
                            "channel": "Medication critical", "importance": "high",
                            "push": {"interruption-level": "critical",
                                     "sound": {"name": "default", "critical": 1, "volume": 1.0}},
                            "actions": [{"action": "MED_GIVEN_" ~ oid, "title": "✅ Mark given"},
                                        {"action": "MED_SNOOZE_" ~ oid, "title": "⏰ Remind me later"},
                                        {"action": "MED_SKIP_" ~ oid, "title": "⏭️ Skip today"}]}
                           if critical_missed else
                           {"tag": "med_missed_" ~ oid, "priority": "high", "ttl": 0,
                            "push": {"interruption-level": "time-sensitive"},
                            "actions": [{"action": "MED_GIVEN_" ~ oid, "title": "✅ Mark given"},
                                        {"action": "MED_SNOOZE_" ~ oid, "title": "⏰ Remind me later"},
                                        {"action": "MED_SKIP_" ~ oid, "title": "⏭️ Skip today"}]}) | combine(nav) }}
                  - action: "notify.{{ notify_service }}"
                    data:
                      title: "⚠️ MISSED: {{ patient }} ({{ clock }})"
                      message: "{{ patient }}'s {{ clock }} dose ({{ meds }}) was NOT marked given. Please check on it."
                      data: "{{ missed_data }}"
  mode: single

- id: med_reminder_mark_given
  alias: "Medication - Notification actions (mark given / skip / snooze)"
  trigger:
    - platform: event
      event_type: mobile_app_notification_action
      id: notif
    - platform: event
      event_type: medication_reminder_dose_given
      id: given
    - platform: event
      event_type: medication_reminder_dose_skipped
      id: skipped
    - platform: event
      event_type: medication_reminder_dose_snoozed
      id: snoozed
  condition:
    - >-
      {{ trigger.id in ['given', 'skipped', 'snoozed']
         or (trigger.event.data.action is defined
             and (trigger.event.data.action.startswith('MED_GIVEN_')
                  or trigger.event.data.action.startswith('MED_SKIP_')
                  or trigger.event.data.action.startswith('MED_SNOOZE_'))) }}
  variables:
    # Change this to adjust how long "Remind me later" defers a reminder.
    snooze_minutes: 30
    oid: >-
      {{ trigger.event.data.entity_id.split('.')[1]
           if trigger.id in ['given', 'skipped', 'snoozed']
         else trigger.event.data.action
              | replace('MED_GIVEN_', '') | replace('MED_SKIP_', '') | replace('MED_SNOOZE_', '') }}
    ent: "switch.{{ oid }}"
    notify_service: "{{ state_attr(ent, 'notify_service') or 'caretakers' }}"
    # Grouped-reminder tag for this dose's (patient, time) slot, so a grouped
    # notification clears too when one of its doses is handled.
    gtag: >-
      {{ ('med_grp_' ~ (state_attr(ent, 'patient') or '') ~ '_' ~ (state_attr(ent, 'dose_time') or '')) | replace(' ', '_') | replace(':', '') }}
    is_give_button: >-
      {{ trigger.id == 'notif' and trigger.event.data.action is defined
         and trigger.event.data.action.startswith('MED_GIVEN_') }}
    is_skip_button: >-
      {{ trigger.id == 'notif' and trigger.event.data.action is defined
         and trigger.event.data.action.startswith('MED_SKIP_') }}
    is_snooze_button: >-
      {{ trigger.id == 'notif' and trigger.event.data.action is defined
         and trigger.event.data.action.startswith('MED_SNOOZE_') }}
  action:
    # A button press performs the action; the event paths are a consequence of
    # the switch changing, so they only clear the notifications.
    - if: "{{ is_give_button }}"
      then:
        - action: switch.turn_on
          target:
            entity_id: "{{ ent }}"
    - if: "{{ is_skip_button }}"
      then:
        - action: medication_reminder.skip_today
          target:
            entity_id: "{{ ent }}"
    - if: "{{ is_snooze_button }}"
      then:
        - action: medication_reminder.snooze
          target:
            entity_id: "{{ ent }}"
          data:
            minutes: "{{ snooze_minutes | int(30) }}"
    - action: "notify.{{ notify_service }}"
      data:
        message: "clear_notification"
        data:
          tag: "med_{{ oid }}"
    - action: "notify.{{ notify_service }}"
      data:
        message: "clear_notification"
        data:
          tag: "med_missed_{{ oid }}"
    # Clear the grouped reminder for this dose's slot too (a no-op if there is none).
    - action: "notify.{{ notify_service }}"
      data:
        message: "clear_notification"
        data:
          tag: "{{ gtag }}"
  mode: parallel

# Low-supply refill reminder. Fires once a day and pings the patient's notify
# target for any medication whose supply has reached its low threshold. Reads
# the per-patient "supplies low" binary sensors created when you track a supply,
# so it picks up new medications automatically; no edits needed here. Change the
# `at:` time to suit, or add more times.
- id: med_supply_low
  alias: "Medication - Low supply refill reminder"
  trigger:
    - platform: time
      at: "09:00:00"
  variables:
    default_notify: caretakers
    # Lovelace path to open when the notification is tapped; "" = app default.
    dashboard_path: ""
    nav: >-
      {{ {"clickAction": dashboard_path, "url": dashboard_path} if dashboard_path else {} }}
  action:
    - repeat:
        for_each: >
          {{ states.binary_sensor
             | selectattr('attributes.low_count', 'defined')
             | selectattr('state', 'eq', 'on')
             | map(attribute='entity_id') | list }}
        sequence:
          - variables:
              ent: "{{ repeat.item }}"
              oid: "{{ ent.split('.')[1] }}"
              patient: "{{ state_attr(ent, 'patient') }}"
              low: "{{ (state_attr(ent, 'low') or []) | join(', ') }}"
              notify_service: "{{ state_attr(ent, 'notify_service') or default_notify }}"
          - action: "notify.{{ notify_service }}"
            data:
              title: "💊 Refill soon: {{ patient }}"
              message: "Low medication supply for {{ patient }}: {{ low }}."
              data: >-
                {{ {"tag": "med_supply_" ~ oid} | combine(nav) }}
  mode: single

# Early-dose warning. Listens for the integration's `medication_reminder_dose_given`
# event (fired when a dose is marked given) and warns if it was given well before
# its scheduled time. A soft over-dose guard: it does NOT block. The warning has
# two action buttons (Companion app): "undo" un-marks the dose if it was a
# mistake, "intended" dismisses. Set early_grace_minutes to 0 to warn on any early
# marking.
- id: med_early_given
  alias: "Medication - Early dose warning"
  trigger:
    - platform: event
      event_type: medication_reminder_dose_given
      id: early_check
    - platform: event
      event_type: mobile_app_notification_action
      id: button
  variables:
    default_notify: caretakers
    early_grace_minutes: 30
    # Lovelace path to open when the notification is tapped; "" = app default.
    dashboard_path: ""
    nav: >-
      {{ {"clickAction": dashboard_path, "url": dashboard_path} if dashboard_path else {} }}
  action:
    - choose:
        # A dose was marked given early -> actionable warning.
        - conditions:
            - "{{ trigger.id == 'early_check' }}"
            - "{{ trigger.event.data.scheduled_today }}"
            - "{{ trigger.event.data.minutes_early is not none and trigger.event.data.minutes_early >= early_grace_minutes }}"
          sequence:
            - variables:
                oid: "{{ trigger.event.data.entity_id.split('.')[1] }}"
                patient: "{{ trigger.event.data.patient }}"
                meds: "{{ trigger.event.data.medications }}"
                mins_early: "{{ trigger.event.data.minutes_early }}"
                notify_service: "{{ trigger.event.data.notify_service or default_notify }}"
                clock: "{{ (as_timestamp(today_at(trigger.event.data.dose_time)) | timestamp_custom('%H:%M')) if state_attr(trigger.event.data.entity_id, 'time_format') == '24h' else (as_timestamp(today_at(trigger.event.data.dose_time)) | timestamp_custom('%I:%M %p')).lstrip('0') }}"
            - action: "notify.{{ notify_service }}"
              data:
                title: "⚠️ Given early: {{ patient }}"
                message: "{{ patient }}'s {{ clock }} dose ({{ meds }}) was marked given {{ mins_early }} min early. Was that on purpose?"
                data: >-
                  {{ {"tag": "med_early_" ~ oid,
                      "actions": [{"action": "MED_UNDO_" ~ oid, "title": "↩️ No, undo it"},
                                  {"action": "MED_KEEP_" ~ oid, "title": "✅ Yes, intended"}]}
                     | combine(nav) }}
        # "Undo" tapped -> un-mark the dose and clear the warning.
        - conditions:
            - "{{ trigger.id == 'button' }}"
            - "{{ trigger.event.data.action.startswith('MED_UNDO_') }}"
          sequence:
            - variables:
                oid: "{{ trigger.event.data.action | replace('MED_UNDO_', '') }}"
                ent: "switch.{{ oid }}"
                notify_service: "{{ state_attr(ent, 'notify_service') or default_notify }}"
            - action: switch.turn_off
              target:
                entity_id: "{{ ent }}"
            - action: "notify.{{ notify_service }}"
              data:
                message: "clear_notification"
                data:
                  tag: "med_early_{{ oid }}"
        # "Intended" tapped -> just clear the warning.
        - conditions:
            - "{{ trigger.id == 'button' }}"
            - "{{ trigger.event.data.action.startswith('MED_KEEP_') }}"
          sequence:
            - variables:
                oid: "{{ trigger.event.data.action | replace('MED_KEEP_', '') }}"
                ent: "switch.{{ oid }}"
                notify_service: "{{ state_attr(ent, 'notify_service') or default_notify }}"
            - action: "notify.{{ notify_service }}"
              data:
                message: "clear_notification"
                data:
                  tag: "med_early_{{ oid }}"
  mode: parallel

# Un-mark alert. Listens for the integration's `medication_reminder_dose_undone`
# event, fired when a dose that was marked given is flipped back to not given
# (e.g. an accidental tap by another caretaker), and notifies the patient's
# notify target, so an un-mark is visible instead of silent. The daily reset
# does NOT fire this event. (An "undo" on an early-dose warning also un-marks, so
# it can surface here too.) Optional.
- id: med_unmark_alert
  alias: "Medication - Un-mark alert"
  trigger:
    - platform: event
      event_type: medication_reminder_dose_undone
  variables:
    default_notify: caretakers
    # Lovelace path to open when the notification is tapped; "" = app default.
    dashboard_path: ""
    nav: >-
      {{ {"clickAction": dashboard_path, "url": dashboard_path} if dashboard_path else {} }}
    ent: "{{ trigger.event.data.entity_id }}"
    oid: "{{ ent.split('.')[1] }}"
    patient: "{{ trigger.event.data.patient }}"
    meds: "{{ trigger.event.data.medications }}"
    notify_service: "{{ state_attr(ent, 'notify_service') or default_notify }}"
    dtime: "{{ state_attr(ent, 'dose_time') }}"
    stype: "{{ state_attr(ent, 'schedule_type') }}"
    clock: "{{ ((as_timestamp(today_at(dtime)) | timestamp_custom('%H:%M')) if state_attr(ent, 'time_format') == '24h' else (as_timestamp(today_at(dtime)) | timestamp_custom('%I:%M %p')).lstrip('0')) if (dtime and stype != 'prn') else '' }}"
  action:
    - action: "notify.{{ notify_service }}"
      data:
        title: "↩️ Un-marked: {{ patient }}"
        message: >-
          {{ patient }}'s {{ (clock ~ ' ') if clock else '' }}dose ({{ meds }})
          was un-marked (flipped back to not given). Mark it given again if that
          was not intended.
        data: >-
          {{ {"tag": "med_unmark_" ~ oid} | combine(nav) }}
  mode: parallel
