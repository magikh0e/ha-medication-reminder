mark_given:
  name: Mark dose given
  description: >-
    Mark a medication dose given, optionally at a specified time. With no time
    it records "now" (the same as tapping the dose switch). A time lets you log
    that the dose was actually taken earlier or later than when you call the
    service, for example logging at 9:00 that it was taken at 8:00.
  target:
    entity:
      integration: medication_reminder
      domain: switch
  fields:
    given_at:
      name: Taken at
      description: When the dose was actually taken. Defaults to now.
      required: false
      example: "2026-06-09 08:00:00"
      selector:
        datetime:
    skipped:
      name: Skipped medications
      description: >-
        Names of medications in this dose that were NOT taken (a partial dose).
        The dose is still marked given, but the supply for each skipped med is
        left alone. Match the names as written in the dose. Applies only when the
        dose is first marked given, not on a later time-correction.
      required: false
      example: '["Vitamin D"]'
      selector:
        text:
          multiple: true

skip_today:
  name: Skip dose for today
  description: >-
    Skip a dose for the current day without taking it. The dose is cleared for
    the day (reminders and missed-dose alerts stop) but it is NOT recorded as
    given and NO supply is deducted. A skipped dose counts as handled, so it does
    not show as overdue. Resets at the daily reset time, the same as a given dose;
    marking the dose given cancels the skip.
  target:
    entity:
      integration: medication_reminder
      domain: switch

snooze:
  name: Snooze (remind me later)
  description: >-
    Defer a dose's reminder for a delay without marking it given or skipped. The
    reminder goes quiet and comes back once, later, if the dose is still not given
    or skipped. The missed-dose escalation is deferred too, not cancelled, so a
    snoozed-then-forgotten dose still escalates eventually. Marking the dose given
    or skipped, and the daily reset, clear the snooze.
  target:
    entity:
      integration: medication_reminder
      domain: switch
  fields:
    minutes:
      name: Minutes
      description: How long to defer the reminder. Defaults to 30.
      required: false
      example: 30
      default: 30
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: box

log_dose:
  name: Log dose (as needed)
  description: >-
    Log an as-needed (PRN) dose, optionally at a specified time. With no time it
    records "now" (the same as tapping the Log dose button). A time lets you log
    that the dose was actually taken earlier than when you call the service. The
    matching supply decrements and the medication's "last taken" sensor updates.
  target:
    entity:
      integration: medication_reminder
      domain: button
  fields:
    taken_at:
      name: Taken at
      description: When the dose was actually taken. Defaults to now.
      required: false
      example: "2026-06-09 14:30:00"
      selector:
        datetime:
